[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-call-graph"
version = "0.1.0"
description = "Static analysis of AI agent session logs — detect wasteful tool call patterns, circular reasoning, and budget anomalies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Yunare Maia", email = "yunare@gmail.com"}
]
keywords = ["ai-agent", "static-analysis", "tool-call", "session-log", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
agent-call-graph = "agentcallgraph.cli:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/agent-call-graph"
Issues = "https://github.com/yunaremaia/agent-call-graph/issues"

[tool.setuptools.packages.find]
include = ["agentcallgraph*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.report]
# Baseline: 69.63% measured on the full suite (243/349 statements, python 3.14).
# floor(measured) on purpose — do NOT move this to the workflow's
# --cov-fail-under and do NOT "round" it up. Two comparisons exist:
#   * pytest-cov >= 6 exit path: coverage's rounded should_fail_under,
#     round(total, precision) < fail_under  -> bites below 68.5%
#   * older pytest-cov exit path: unrounded total < fail_under -> bites below 69%
# 69 passes and bites under both; 70 is 0.13pp under the measured value and
# breaks CI the first time a statement count shifts on another Python.
fail_under = 69

[tool.ruff]
target-version = "py311"
line-length = 100
